name: Release

on:
  workflow_dispatch: 

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  release:
    permissions:
      id-token: write

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up uv
      uses: astral-sh/setup-uv@v4

    - name: Build
      run: |
        uv build

    - name: Publish package
      uses: pypa/gh-action-pypi-publish@release/v1
